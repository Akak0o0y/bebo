name: Feature request
description: Propose a focused improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain a concrete example and how success could be checked.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or relevant references
  - type: dropdown
    id: contribution
    attributes:
      label: Would you like to help implement it?
      options:
        - I can help with implementation
        - I can help test or document it
        - I am proposing an idea
